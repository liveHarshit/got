name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx vitest run
      - run: bunx vite build
        env:
          GH_PAGES: "1"
      # Deep links like /got/?s=6&e=10 and unknown paths fall back to the app.
      - run: |
          D=$(dirname "$(ls dist/client/index.html .output/public/index.html 2>/dev/null | head -1)")
          echo "Static output: $D"
          mkdir -p site && cp -r "$D"/. site/
          cp site/index.html site/404.html && touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
